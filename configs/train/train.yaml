max_epochs: 30
batch_size: 32
num_workers: 2
learning_rate: 0.001
weight_decay: 0.01
gradient_clip_val: 1.0
early_stopping_patience: 8
precision: 16-mixed
accelerator: auto
devices: 1
val_check_interval: 1.0
log_every_n_steps: 10

train_profiles:
  - constant
  - pulse

test_profiles:
  - random
  - wltp

split:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 2
